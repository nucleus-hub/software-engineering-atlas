site_name: Software Engineering Atlas — System Design
site_description: Visual interview notes for Senior, Staff, and Principal Engineers
docs_dir: system-design
site_dir: site/system-design
exclude_docs: |
  _support/tools/

theme:
  name: material
  language: en
  # Colours come from _support/stylesheets/theme.css (WCAG 2.2 AA checked).
  # Google Fonts is blocked on the corporate network; theme.css uses system fonts.
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

nav:
  - Home: README.md
  - Basics:
      - Interview Framework & Capacity Estimation: basics/01_Interview_Framework_And_Capacity_Estimation.md
      - Object-Oriented Principles & Clean Code: basics/02_LLD_Object_Oriented_Principles_And_Clean_Code.md
      - Creational & Structural Design Patterns: basics/03_LLD_Creational_And_Structural_Design_Patterns.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - _support/stylesheets/layout.css
  - _support/stylesheets/theme.css
